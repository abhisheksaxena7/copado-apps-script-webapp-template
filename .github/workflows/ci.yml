name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Reject credential artifacts
        run: |
          if git ls-files | grep -E '(^|/)(\.clasprc\.json|\.env|credentials?\.json)$'; then
            echo "Credential-like files are tracked." >&2
            exit 1
          fi
