name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEV_SCRIPT_ID != '' && vars.DEV_DEPLOYMENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm install --global @google/clasp@3.3.0
      - name: Authenticate without exposing the OAuth token
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
      - name: Configure the development Apps Script project
        env:
          SCRIPT_ID: ${{ vars.DEV_SCRIPT_ID }}
        run: printf '{"scriptId":"%s","rootDir":"apps-script"}\n' "$SCRIPT_ID" > .clasp.json
      - run: clasp push --force
      - name: Advance the stable development deployment
        env:
          DEPLOYMENT_ID: ${{ vars.DEV_DEPLOYMENT_ID }}
          DEPLOY_DESCRIPTION: dev-${{ github.sha }}
        run: scripts/redeploy-stable.sh
